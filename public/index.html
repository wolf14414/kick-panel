<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans antialiased flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-gray-700">
            <h1 class="text-xl font-bold text-green-400"><i class="fa-brands fa-kickstarter"></i> Kick Panel</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-gray-700 rounded-lg text-green-400 hover:bg-gray-600 transition">
                <i class="fa-solid fa-chart-line"></i> Yönetici Paneli
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                <i class="fa-solid fa-user-plus"></i> Hesap Ekleme
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                <i class="fa-solid fa-key"></i> Lisans Yönetimi
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8">
            <h2 class="text-3xl font-bold">Yönetici Paneli</h2>
            <p class="text-gray-400 mt-1">Kick kanalınızı bağlayın ve yönetin.</p>
        </header>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg max-w-2xl">
            <h3 class="text-xl font-semibold mb-4">Kanal Ekle / Sorgula</h3>
            <div class="flex gap-4">
                <div class="flex-1 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">kick.com/</span>
                    <input type="text" id="channelName" class="w-full pl-24 pr-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-green-500 transition" placeholder="kanaladi">
                </div>
                <button onclick="checkChannel()" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition">
                    Bağla
                </button>
            </div>
        </div>

        <div id="statusPanel" class="mt-8 hidden">
            <div id="statusAlert" class="p-4 rounded-lg mb-6 font-semibold flex items-center gap-3"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="featuresGrid">
                <div class="feature-card bg-gray-800 p-6 rounded-xl border border-gray-700 opacity-50 cursor-not-allowed transition">
                    <h4 class="text-lg font-bold mb-2"><i class="fa-solid fa-robot text-blue-400"></i> Chat Botu Bağla</h4>
                    <p class="text-sm text-gray-400">Kanal çevrimiçi olduğunda botu aktif edebilirsiniz.</p>
                    <button class="mt-4 px-4 py-2 bg-blue-600 rounded-lg disabled:opacity-50" disabled>Aktif Et</button>
                </div>
                <div class="feature-card bg-gray-800 p-6 rounded-xl border border-gray-700 opacity-50 cursor-not-allowed transition">
                    <h4 class="text-lg font-bold mb-2"><i class="fa-solid fa-chart-pie text-purple-400"></i> Anlık İstatistik</h4>
                    <p class="text-sm text-gray-400">Yayın istatistiklerini görüntülemek için yayın açık olmalıdır.</p>
                    <button class="mt-4 px-4 py-2 bg-purple-600 rounded-lg disabled:opacity-50" disabled>Görüntüle</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function checkChannel() {
            const channelName = document.getElementById('channelName').value.trim();
            if (!channelName) return alert("Lütfen bir kanal adı girin!");

            const statusPanel = document.getElementById('statusPanel');
            const statusAlert = document.getElementById('statusAlert');
            const featureCards = document.querySelectorAll('.feature-card');
            const featureButtons = document.querySelectorAll('.feature-card button');

            statusPanel.classList.remove('hidden');
            statusAlert.className = "p-4 rounded-lg mb-6 font-semibold flex items-center gap-3 bg-gray-700 text-gray-300";
            statusAlert.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Backend üzerinden Kick API sorgulanıyor...';

            try {
                // Kendi sunucumuzdaki API uç noktasına istek atıyoruz
                const response = await fetch(`/api/check-kick/${channelName}`);
                const result = await response.json();

                if (result.success && result.isLive) {
                    // ÇEVRİMİÇİ
                    statusAlert.className = "p-4 rounded-lg mb-6 font-semibold flex items-center gap-3 bg-green-900 border border-green-500 text-green-400";
                    statusAlert.innerHTML = `<i class="fa-solid fa-circle-check"></i> [${channelName}] şu an yayında! Özelliklerin kilidi açıldı.`;
                    
                    featureCards.forEach(card => card.classList.remove('opacity-50', 'cursor-not-allowed'));
                    featureButtons.forEach(btn => btn.removeAttribute('disabled'));
                } else {
                    // ÇEVRİMDIŞI
                    statusAlert.className = "p-4 rounded-lg mb-6 font-semibold flex items-center gap-3 bg-red-900 border border-red-500 text-red-400";
                    statusAlert.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> [${channelName}] şu an çevrimdışı. Uyarı: Yayın kapalıyken özellikler kullanılamaz!`;
                    
                    featureCards.forEach(card => card.classList.add('opacity-50', 'cursor-not-allowed'));
                    featureButtons.forEach(btn => btn.setAttribute('disabled', 'true'));
                }
            } catch (error) {
                statusAlert.className = "p-4 rounded-lg mb-6 font-semibold flex items-center gap-3 bg-yellow-900 border border-yellow-500 text-yellow-400";
                statusAlert.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Sistemsel bir hata oluştu veya kanal bulunamadı.`;
            }
        }
    </script>
</body>
</html>
